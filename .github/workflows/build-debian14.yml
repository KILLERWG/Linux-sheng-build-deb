name: 🌀 Build Debian 14

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本号 (例如 7.1.0)'
        required: true
        type: string
        default: '7.1.1'
      variant:
        description: '选择构建类型'
        required: true
        type: choice
        options:
          - desktop
          - server
        default: 'desktop'
      desktop_env:
        description: '选择桌面环境 (仅 desktop 类型)'
        type: choice
        options:
          - all
          - gnome
          - kde
        default: 'all'
      boot_mode:
        description: '选择启动模式'
        required: true
        type: choice
        options:
          - all
          - dual
          - single
        default: 'all'
      skip_release:
        description: '跳过创建GitHub Release'
        type: boolean
        default: false
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04-arm
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      variant: ${{ steps.tag.outputs.variant }}
      matrix_desktop: ${{ steps.set-matrix.outputs.desktop }}
      matrix_boot: ${{ steps.set-matrix.outputs.boot }}
    steps:
      - name: Generate release tag
        id: tag
        run: |
          VARIANT="${{ github.event.inputs.variant || 'desktop' }}"
          TAG="debian14-${VARIANT}-$(date -u '+%Y%m%d')-${GITHUB_SHA::8}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "variant=$VARIANT" >> $GITHUB_OUTPUT

      - name: 🧮 Generate Dynamic Matrix
        id: set-matrix
        run: |
          VARIANT="${{ github.event.inputs.variant || 'desktop' }}"
          if [ "$VARIANT" == "server" ]; then
            echo 'desktop=["server"]' >> $GITHUB_OUTPUT
          else
            DESKTOP="${{ github.event.inputs.desktop_env || 'all' }}"
            if [ "$DESKTOP" == "all" ]; then
              echo 'desktop=["gnome", "kde"]' >> $GITHUB_OUTPUT
            else
              echo "desktop=[\"$DESKTOP\"]" >> $GITHUB_OUTPUT
            fi
          fi

          BOOT="${{ github.event.inputs.boot_mode || 'all' }}"
          if [ "$BOOT" == "all" ]; then
            echo 'boot=["dual", "single"]' >> $GITHUB_OUTPUT
          else
            echo "boot=[\"$BOOT\"]" >> $GITHUB_OUTPUT
          fi

  build-debian:
    name: Build (${{ matrix.desktop }} | ${{ matrix.boot }})
    runs-on: ubuntu-24.04-arm
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.prepare-release.outputs.matrix_desktop) }}
        boot: ${{ fromJSON(needs.prepare-release.outputs.matrix_boot) }}

    steps:
      - uses: actions/checkout@v4

      - name: "🔧 部署构建环境"
        run: |
          sudo apt update
          sudo apt install -y debootstrap libarchive-tools zstd curl wget android-sdk-libsparse-utils coreutils

      - name: Download kernel and sensor packages
        run: |
          echo "::group::Download kernel packages (kernel-${{ github.event.inputs.kernel_version }})"
          if gh release view "kernel-${{ github.event.inputs.kernel_version }}" --repo "${{ github.repository }}" &>/dev/null; then
            gh release download "kernel-${{ github.event.inputs.kernel_version }}" \
              --pattern "*.deb" --repo "${{ github.repository }}" --clobber
            echo "✅ kernel packages downloaded"
          else
            echo "❌ ERROR: Release 'kernel-${{ github.event.inputs.kernel_version }}' not found!"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Download sensor packages (ppd-arm-sync)"
          if gh release view "ppd-arm-sync" --repo "${{ github.repository }}" &>/dev/null; then
            gh release download "ppd-arm-sync" \
              --pattern "*.deb" --repo "${{ github.repository }}" --clobber
            echo "✅ sensor packages downloaded"
          else
            echo "❌ ERROR: Release 'ppd-arm-sync' not found!"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Download auth packages (xiaomi-mipps-auth)"
          if gh release view "xiaomi-mipps-auth" --repo "${{ github.repository }}" &>/dev/null; then
            gh release download "xiaomi-mipps-auth" \
              --pattern "*.deb" --repo "${{ github.repository }}" --clobber
            echo "✅ auth packages downloaded"
          else
            echo "❌ ERROR: Release 'xiaomi-mipps-auth' not found!"
            exit 1
          fi
          echo "::endgroup::"

          ls -la *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RootFS
        id: build
        run: |
          echo "::group::🔨 Build RootFS"
          echo "  Kernel version : ${{ github.event.inputs.kernel_version }}"
          echo "  Desktop        : ${{ matrix.desktop }}"
          echo "  Boot mode      : ${{ matrix.boot }}"

          chmod +x debian-sheng-rootfs-build.sh
          if [ "${{ matrix.desktop }}" == "server" ]; then
            echo "  Type           : server"
            sudo bash debian-sheng-rootfs-build.sh debian-server "${{ github.event.inputs.kernel_version }}" "${{ matrix.boot }}"
          else
            echo "  Type           : desktop"
            sudo bash debian-sheng-rootfs-build.sh debian-desktop "${{ github.event.inputs.kernel_version }}" "${{ matrix.boot }}" "${{ matrix.desktop }}"
          fi
          echo "::endgroup::"

          echo "::group::📦 Check raw artifacts"
          RAW_COUNT=$(ls -1 *.img *.zst 2>/dev/null | wc -l)
          if [ "$RAW_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No image files found after build!"
            exit 1
          fi
          ls -lh *.img *.zst 2>/dev/null || true
          echo "::endgroup::"

      # ✅ 新增：极限压缩 + 自动拆分（解决 2GB 限制）
      - name: 🗜️ Compress & Split Image (zstd ultra)
        id: compress
        run: |
          echo "::group::🗜️ Extreme compression with zstd -19 --ultra --long=31"
          
          # 安装最新版 zstd（确保支持 --ultra 和 --long=31）
          ZSTD_VER=$(zstd --version | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "Current zstd version: $ZSTD_VER"
          
          FINAL_FILES=""
          for img in *.img *.zst; do
            [ -f "$img" ] || continue
            
            BASENAME=$(basename "$img" .zst)
            BASENAME=$(basename "$BASENAME" .img)
            OUT_ZST="${BASENAME}.zst"
            
            echo "⏳ Compressing $img -> $OUT_ZST (this may take a while...)"
            # 如果已经是 .zst，先解压再重压；如果是 .img，直接压
            if [[ "$img" == *.zst ]]; then
              zstd -d "$img" -o "${BASENAME}.tmp.img" --rm -f
              zstd -19 --ultra --long=31 -T0 "${BASENAME}.tmp.img" -o "$OUT_ZST" --rm -f
            else
              zstd -19 --ultra --long=31 -T0 "$img" -o "$OUT_ZST" --rm -f
            fi
            
            SIZE=$(stat -c%s "$OUT_ZST")
            MAX_SIZE=$((2 * 1024 * 1024 * 1024))  # 2 GiB
            
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "⚠️ File $OUT_ZST is $(numfmt --to=iec-i --suffix=B $SIZE), exceeding 2GiB limit."
              echo "✂️ Splitting into 1.9GiB parts..."
              split -b 1900M "$OUT_ZST" "${OUT_ZST}.part_"
              rm -f "$OUT_ZST"
              PARTS=$(ls -1 "${OUT_ZST}.part_"* | tr '\n' ' ')
              FINAL_FILES="$FINAL_FILES $PARTS"
              echo "✅ Split complete: $PARTS"
            else
              echo "✅ $OUT_ZST is $(numfmt --to=iec-i --suffix=B $SIZE), within limit."
              FINAL_FILES="$FINAL_FILES $OUT_ZST"
            fi
          done
          
          # 清理临时文件
          rm -f *.tmp.img
          
          # 输出最终文件列表供后续步骤使用
          echo "final_files=$FINAL_FILES" >> $GITHUB_OUTPUT
          echo "📦 Final artifacts:"
          ls -lh $FINAL_FILES
          echo "::endgroup::"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.desktop }}-${{ matrix.boot }}
          path: |
            *.zst
            *.zst.part_*
          retention-days: 7

      - name: Upload to Release
        if: ${{ github.event.inputs.skip_release != 'true' && steps.compress.outputs.final_files != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: "Debian 14 (${{ needs.prepare-release.outputs.variant }})"
          body: |
            ### 📋 系统信息
            | 项目 | 详情 |
            |------|------|
            | 系统 | Debian 14 (Forky) |
            | 内核版本 | ${{ github.event.inputs.kernel_version }} |
            | 类型 | ${{ needs.prepare-release.outputs.variant }} |
            | 桌面环境 | ${{ matrix.desktop }} |
            | 启动模式 | ${{ matrix.boot }} |

            ### 🔐 默认凭据
            - 用户名: `Lau` / 密码: `0000`

            ### ⚠️ 下载须知
            如果文件名包含 `.part_` 后缀，表示文件因超过 GitHub 2GB 限制被自动拆分。
            请下载所有分片后，在本地执行以下命令合并：
            ```bash
            cat *.zst.part_* > debian-image.zst
            zstd -d debian-image.zst
            ```
          files: ${{ steps.compress.outputs.final_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
