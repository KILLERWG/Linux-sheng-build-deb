name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本号 (例如 7.1.4)'
        required: true
        type: string
        default: '7.1.4'
      build_bundle:
        description: '同时构建固件/传感器组件'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ==========================================
  # Job 1: 内核编译
  # ==========================================
  build-kernel:
    name: "构建内核 v${{ github.event.inputs.kernel_version }}"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "📥 检出代码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "💾 恢复 ccache 缓存"
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-unified-kernel-${{ github.event.inputs.kernel_version }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-unified-kernel-${{ github.event.inputs.kernel_version }}-
            ${{ runner.os }}-ccache-unified-kernel-

      - name: "🔧 部署 LLVM 交叉编译环境"
        run: |
          set -euo pipefail
          echo "⚙️ 正在安装必要的构建工具..."

          # 统一使用 HTTPS 源，降低 HTTP 80 端口超时概率
          sudo sed -i 's|http://ports.ubuntu.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true

          # CI 网络抖动容错
          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "6";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          EOF

          sudo apt-get update
          sudo apt-get install -y --fix-missing build-essential flex bison libssl-dev libelf-dev bc ccache clang llvm lld wget xz-utils unzip systemd-ukify systemd-boot-efi

          echo "✅ 构建工具安装完成"

          mkdir -p /home/runner/.ccache
          ccache --set-config=max_size=10G
          ccache --set-config=cache_dir=/home/runner/.ccache
          ccache --set-config=sloppiness=file_macro,locale,time_macros
          ccache --set-config=hash_dir=false

      - name: "🔨 编译内核"
        id: build
        env:
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
        run: |
          echo "🚀 开始编译内核版本 ${{ github.event.inputs.kernel_version }}"

          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=10G

          chmod +x scripts/sheng-kernel-build.sh
          bash scripts/sheng-kernel-build.sh "${{ github.event.inputs.kernel_version }}"

          echo "✅ 内核编译完成"
          ccache --show-stats || true

      - name: "💾 保存 ccache 缓存"
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-unified-kernel-${{ github.event.inputs.kernel_version }}-${{ github.ref_name }}

      - name: "📦 收集并统计编译产物"
        id: collect
        run: |
          echo "::group::Debian 包 (.deb)"
          PKG_COUNT=$(ls -1 packages/*.deb 2>/dev/null | wc -l)
          if [ "$PKG_COUNT" -gt 0 ]; then
            echo "📦 共找到 $PKG_COUNT 个 Debian 包文件:"
            ls -lh packages/*.deb
          else
            echo "❌ ERROR: 未找到任何 .deb 文件！"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::启动镜像 (.img)"
          IMG_COUNT=$(ls -1 boot_*.img 2>/dev/null | wc -l)
          if [ "$IMG_COUNT" -gt 0 ]; then
            echo "🖼️  共找到 $IMG_COUNT 个启动镜像:"
            ls -lh boot_*.img
          else
            echo "❌ ERROR: 未找到任何 boot.img 文件！"
            exit 1
          fi
          echo "::endgroup::"

          echo "pkg_count=$PKG_COUNT" >> $GITHUB_OUTPUT

      - name: "📤 上传内核 .deb"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: "packages/*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "📤 上传启动镜像 (boot.img)"
        uses: actions/upload-artifact@v4
        with:
          name: boot-images
          path: |
            boot_sheng_singleboot.img
            boot_sheng_dualboot.img
          retention-days: 7

      - name: "📤 上传 UKI EFI"
        uses: actions/upload-artifact@v4
        with:
          name: boot-efi
          path: bootaa64.efi
          retention-days: 7

  # ==========================================
  # Job 2: 固件/传感器组件 (与内核并行)
  # ==========================================
  build-bundle:
    name: "构建固件/传感器组件"
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event.inputs.build_bundle == 'true' }}

    steps:
      - name: "📥 检出代码"
        uses: actions/checkout@v4

      - name: "🔧 部署构建环境"
        run: |
          set -euo pipefail

          sudo sed -i 's|http://ports.ubuntu.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true

          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "6";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          EOF

          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            build-essential autoconf automake libtool \
            clang lld \
            pkg-config ninja-build \
            libglib2.0-dev libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev \
            libgudev-1.0-dev libpolkit-gobject-1-dev \
            libsystemd-dev libdbus-1-dev \
            protobuf-compiler protobuf-c-compiler \
            libyaml-dev libbsd-dev \
            wget unzip zstd python3 python3-pip

          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "meson>=1.4.0"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          echo "✅ 构建工具安装完成"

      - name: "🔨 构建固件组件"
        run: |
          chmod +x scripts/sheng-firmware-build.sh
          bash scripts/sheng-firmware-build.sh
          echo "✅ 固件组件构建完成"

      - name: "📦 收集产物"
        id: collect
        run: |
          echo "::group::设备 .deb 包"
          PKG_COUNT=$(ls -1 packages/*.deb 2>/dev/null | wc -l)
          if [ "$PKG_COUNT" -gt 0 ]; then
            echo "📦 共找到 $PKG_COUNT 个包:"
            ls -lh packages/*.deb
          else
            echo "❌ ERROR: 未找到任何 .deb 文件！"
            exit 1
          fi
          echo "::endgroup::"
          echo "pkg_count=$PKG_COUNT" >> $GITHUB_OUTPUT

      - name: "📤 上传固件 .deb"
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debs
          path: "packages/*.deb"
          retention-days: 7
          if-no-files-found: error

  # ==========================================
  # Job 3: 统一发布
  # ==========================================
  publish:
    name: "发布 Release"
    runs-on: ubuntu-latest
    needs: [build-kernel, build-bundle]
    if: |
      always() &&
      (needs.build-kernel.result == 'success' || needs.build-bundle.result == 'success')

    steps:
      - name: "📥 下载内核产物"
        uses: actions/download-artifact@v4
        with:
          name: kernel-debs
          path: artifacts/kernel

      - name: "📥 下载固件产物"
        uses: actions/download-artifact@v4
        with:
          name: bundle-debs
          path: artifacts/bundle
        continue-on-error: true

      - name: "📥 下载启动镜像"
        uses: actions/download-artifact@v4
        with:
          name: boot-images
          path: artifacts/boot

      - name: "📥 下载 UKI EFI"
        uses: actions/download-artifact@v4
        with:
          name: boot-efi
          path: artifacts/efi

      - name: "📦 合并产物"
        run: |
          echo "::group::最终产物列表"
          find artifacts -type f -ls
          echo "::endgroup::"

          # 合并所有 .deb 到 publish 目录
          mkdir -p publish
          find artifacts -name "*.deb" -exec cp {} publish/ \;
          find artifacts -name "*.img" -exec cp {} publish/ \;
          find artifacts -name "*.efi" -exec cp {} publish/ \;

          echo "::group::待发布文件"
          ls -lh publish/
          echo "::endgroup::"

      - name: "🏷️ 发布 GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-${{ github.event.inputs.kernel_version }}
          name: "Kernel v${{ github.event.inputs.kernel_version }}"
          body: |
            **Xiaomi Pad 6S Pro Kernel, boot, UEFI v${{ github.event.inputs.kernel_version }}**

  
          draft: false
          prerelease: false
          files: |
            publish/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
