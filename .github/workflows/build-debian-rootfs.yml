name: 🌀 Build Debian RootFS

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本号 (例如 7.1.0)'
        required: true
        type: string
        default: '7.1.0'
      debian_version:
        description: '选择 Debian 版本'
        required: true
        type: choice
        options:
          - trixie
          - forky
        default: 'forky'
      variant:
        description: '选择构建类型'
        required: true
        type: choice
        options:
          - desktop
          - server
        default: 'desktop'
      desktop_env:
        description: '选择桌面环境 (仅 desktop 类型)'
        type: choice
        options:
          - all
          - gnome
          - kde
        default: 'all'
      boot_mode:
        description: '选择启动模式'
        required: true
        type: choice
        options:
          - all
          - dual
          - single
        default: 'all'
      username:
        description: '普通用户名 (默认 xiaomi)'
        type: string
        default: 'xiaomi'
      password:
        description: '普通用户密码 (默认 xiaomi)'
        type: string
        default: 'xiaomi'
      skip_release:
        description: '跳过创建GitHub Release'
        type: boolean
        default: false
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04-arm
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      debian_version: ${{ steps.tag.outputs.debian_version }}
      variant: ${{ steps.tag.outputs.variant }}
      matrix_desktop: ${{ steps.set-matrix.outputs.desktop }}
      matrix_boot: ${{ steps.set-matrix.outputs.boot }}
    steps:
      - name: Generate release tag
        id: tag
        run: |
          VERSION="${{ github.event.inputs.debian_version || 'forky' }}"
          VARIANT="${{ github.event.inputs.variant || 'desktop' }}"
          TAG="debian-${VERSION}-${VARIANT}-$(date -u '+%Y%m%d')-${GITHUB_SHA::8}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "debian_version=$VERSION" >> $GITHUB_OUTPUT
          echo "variant=$VARIANT" >> $GITHUB_OUTPUT

      - name: 🧮 Generate Dynamic Matrix
        id: set-matrix
        run: |
          VARIANT="${{ github.event.inputs.variant || 'desktop' }}"
          if [ "$VARIANT" == "server" ]; then
            echo 'desktop=["server"]' >> $GITHUB_OUTPUT
          else
            DESKTOP="${{ github.event.inputs.desktop_env || 'all' }}"
            if [ "$DESKTOP" == "all" ]; then
              echo 'desktop=["gnome", "kde"]' >> $GITHUB_OUTPUT
            else
              echo "desktop=[\"$DESKTOP\"]" >> $GITHUB_OUTPUT
            fi
          fi

          BOOT="${{ github.event.inputs.boot_mode || 'all' }}"
          if [ "$BOOT" == "all" ]; then
            echo 'boot=["dual", "single"]' >> $GITHUB_OUTPUT
          else
            echo "boot=[\"$BOOT\"]" >> $GITHUB_OUTPUT
          fi

  build-debian:
    name: Build (${{ needs.prepare-release.outputs.debian_version }} | ${{ matrix.desktop }} | ${{ matrix.boot }})
    runs-on: ubuntu-24.04-arm
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.prepare-release.outputs.matrix_desktop) }}
        boot: ${{ fromJSON(needs.prepare-release.outputs.matrix_boot) }}

    steps:
      - uses: actions/checkout@v4

      - name: "🔧 部署构建环境"
        run: |
          sudo apt update
          sudo apt install -y debootstrap libarchive-tools zstd curl wget android-sdk-libsparse-utils

      - name: Download kernel and sensor packages
        run: |
          echo "::group::Download kernel packages (kernel-${{ github.event.inputs.kernel_version }})"
          if gh release view "kernel-${{ github.event.inputs.kernel_version }}" --repo "${{ github.repository }}" &>/dev/null; then
            gh release download "kernel-${{ github.event.inputs.kernel_version }}" \
              --pattern "*.deb" --repo "${{ github.repository }}" --clobber
            echo "✅ kernel packages downloaded"
          else
            echo "❌ ERROR: Release 'kernel-${{ github.event.inputs.kernel_version }}' not found!"
            exit 1
          fi
          echo "::endgroup::"


          ls -la *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RootFS
        id: build
        run: |
          echo "::group::🔨 Build RootFS"
          echo "  Kernel version : ${{ github.event.inputs.kernel_version }}"
          echo "  Desktop        : ${{ matrix.desktop }}"
          echo "  Boot mode      : ${{ matrix.boot }}"

          chmod +x debian-sheng-rootfs-build.sh
          DEBIAN_VER="${{ needs.prepare-release.outputs.debian_version }}"
          if [ "${{ matrix.desktop }}" == "server" ]; then
            echo "  Type           : server"
            echo "  Debian version : $DEBIAN_VER"
            sudo bash debian-sheng-rootfs-build.sh "debian-${DEBIAN_VER}-server" "${{ github.event.inputs.kernel_version }}" "${{ matrix.boot }}" "server" "${{ github.event.inputs.username }}" "${{ github.event.inputs.password }}"
          else
            echo "  Type           : desktop"
            echo "  Debian version : $DEBIAN_VER"
            sudo bash debian-sheng-rootfs-build.sh "debian-${DEBIAN_VER}-desktop" "${{ github.event.inputs.kernel_version }}" "${{ matrix.boot }}" "${{ matrix.desktop }}" "${{ github.event.inputs.username }}" "${{ github.event.inputs.password }}"
          fi
          echo "::endgroup::"

          echo "::group::📦 Build artifacts"
          PKG_COUNT=$(ls -1 *.zst 2>/dev/null | wc -l)
          if [ "$PKG_COUNT" -gt 0 ]; then
            echo "Found $PKG_COUNT image(s):"
            ls -lh *.zst
          else
            echo "❌ ERROR: No .zst image found!"
            exit 1
          fi
          echo "pkg_count=$PKG_COUNT" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-${{ needs.prepare-release.outputs.debian_version }}-${{ matrix.desktop }}-${{ matrix.boot }}
          path: "*.zst"
          retention-days: 7

      - name: Upload to Release
        if: ${{ github.event.inputs.skip_release != 'true' && steps.build.outputs.pkg_count > 0 }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: "Debian ${{ needs.prepare-release.outputs.debian_version }} (${{ needs.prepare-release.outputs.variant }})"
          body: |
            ### 📋 系统信息
            | 项目 | 详情 |
            |------|------|
            | 系统 | Debian ${{ needs.prepare-release.outputs.debian_version }} |
            | 内核版本 | ${{ github.event.inputs.kernel_version }} |
            | 类型 | ${{ needs.prepare-release.outputs.variant }} |

            ### 🔐 默认凭据
            - 用户名: `${{ github.event.inputs.username }}` / 密码: `${{ github.event.inputs.password }}`
          files: "*.zst"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
